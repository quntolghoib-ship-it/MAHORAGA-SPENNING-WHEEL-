
plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
}

version = '1.0.0'
group = 'com.quntolghoib.mahoraga'

base {
    archivesName = 'mahoraga-wheel'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.5:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.19.3'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}
loom {
    mixin {
        defaultRefmapName = "mahoraga-wheel-refmap.json"
    }
}
